<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Singularity</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kentatvv1-tech/UI-BYKENTA/main/logo%20w.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <canvas id="starfield"></canvas>

    <div class="auth-wrapper">
        <div class="auth-card glass-panel">
            <!-- Logo -->
            <div class="auth-logo">
                <img src="https://raw.githubusercontent.com/kentatvv1-tech/UI-BYKENTA/main/logo%20w.png" alt="Singularity Logo" class="auth-logo-img">
                <span>Singularity</span>
            </div>
            <h2 class="auth-title">Create your account</h2>

            <!-- Error Banner -->
            <div id="errorBanner" class="error-banner hidden"></div>

            <!-- Form -->
            <form id="registerForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="your-username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password <span class="hint">(min 6 characters)</span></label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="new-password">
                </div>
                <button type="submit" id="registerBtn" class="btn-auth">
                    <span id="registerBtnText">Create account</span>
                    <span id="registerSpinner" class="spinner hidden"></span>
                </button>

                <div style="display: flex; align-items: center; text-align: center; margin: 20px 0;">
                    <div style="flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1);"></div>
                    <span style="padding: 0 10px; color: #666; font-size: 0.85rem;">OR</span>
                    <div style="flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1);"></div>
                </div>

                <button type="button" id="discordRegisterBtn" class="btn-auth" style="background: #5865F2; color: white;">
                    <i class="ph-fill ph-discord-logo" style="font-size: 1.2rem; margin-right: 8px;"></i>
                    Continue with Discord
                </button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { register, loginWithDiscord } from "./auth.js";
        import { supabase } from "./supabase-config.js";

        // If already logged in, redirect
        supabase.auth.onAuthStateChange((event, session) => {
            if (session) window.location.href = "index.html";
        });

        const form        = document.getElementById("registerForm");
        const discordBtn = document.getElementById("discordRegisterBtn");
        const errorBanner = document.getElementById("errorBanner");
        const registerBtn = document.getElementById("registerBtn");
        const btnText     = document.getElementById("registerBtnText");
        const spinner     = document.getElementById("registerSpinner");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const email    = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!username) {
                errorBanner.textContent = "Please enter a username.";
                errorBanner.classList.remove("hidden");
                return;
            }
            if (password.length < 6) {
                errorBanner.textContent = "Password must be at least 6 characters.";
                errorBanner.classList.remove("hidden");
                return;
            }

            errorBanner.classList.add("hidden");
            registerBtn.disabled = true;
            btnText.textContent  = "Creating account...";
            spinner.classList.remove("hidden");

            try {
                const data = await register(email, password, username);
                
                // If session is null, it means Email Confirmation is required
                if (data.user && !data.session) {
                    errorBanner.textContent = "Success! Please check your email inbox to verify your account.";
                    errorBanner.className = "error-banner success";
                    errorBanner.style.backgroundColor = "rgba(46, 204, 113, 0.1)";
                    errorBanner.style.color = "#2ecc71";
                    errorBanner.style.borderColor = "rgba(46, 204, 113, 0.3)";
                    errorBanner.classList.remove("hidden");
                    form.reset();
                } else {
                    window.location.href = "index.html";
                }
            } catch (err) {
                let msg = "Registration failed. Please try again.";
                if (err.code === "auth/email-already-in-use") msg = "This email is already registered.";
                if (err.code === "auth/invalid-email")        msg = "Invalid email address.";
                if (err.code === "auth/weak-password")        msg = "Password is too weak.";
                errorBanner.textContent = msg;
                errorBanner.classList.remove("hidden");
            } finally {
                registerBtn.disabled = false;
                btnText.textContent  = "Create account";
                spinner.classList.add("hidden");
            }
        });

        discordBtn.addEventListener("click", async () => {
            try {
                discordBtn.disabled = true;
                discordBtn.innerHTML = '<span class="spinner"></span>';
                await loginWithDiscord();
            } catch (err) {
                console.error("Discord login error:", err);
                discordBtn.disabled = false;
                discordBtn.innerHTML = '<i class="ph-fill ph-discord-logo" style="font-size: 1.2rem; margin-right: 8px;"></i> Continue with Discord';
                errorBanner.textContent = "Failed to register with Discord.";
                errorBanner.classList.remove("hidden");
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
