<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor — Singularity</title>
    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/kentatvv1-tech/UI-BYKENTA/main/logo%20w.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .editor-wrap {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
        }

        .editor-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.4);
        }

        .editor-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #monacoContainer {
            flex: 1;
            min-height: 0;
        }

        .save-status {
            font-size: 0.82rem;
            color: #666;
            transition: color 0.3s;
        }

        .save-status.saved {
            color: #4ade80;
        }

        .save-status.saving {
            color: #facc15;
        }

        .save-status.error {
            color: #f87171;
        }
    </style>
    <script src="i18n.js"></script>
</head>

<body style="overflow:hidden">
    <canvas id="starfield" style="z-index:-1"></canvas>

    <nav class="navbar" style="position:relative">
        <div class="nav-left">
            <div class="logo">
                <img src="https://raw.githubusercontent.com/kentatvv1-tech/UI-BYKENTA/main/logo%20w.png"
                    alt="Singularity Logo" class="custom-logo">
                <span>Singularity</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="home.html" data-i18n="nav.home">หน้าแรก</a></li>
            <li><a href="index.html" data-i18n="nav.dashboard">แดชบอร์ด</a></li>
            <li><a href="issues.html" data-i18n="nav.issues">แจ้งปัญหา</a></li>
            <li><a href="profile.html" data-i18n="nav.profile">โปรไฟล์</a></li>
            <li><a href="scripts.html" data-i18n="nav.scripts">สคริปต์ฮับ</a></li>
            <li><a href="key.html" data-i18n="nav.key">คีย์ของฉัน</a></li>
            <li><a href="executors.html" class="active" data-i18n="nav.executors">ตัวรัน</a></li>
        </ul>
        <div class="nav-right">
            <div class="editor-actions">
                <span id="saveStatus" class="save-status" style="display:none">No changes</span>
                <label style="display:none; align-items:center; gap:10px; cursor:pointer;" id="editorObfuscateWrapper"
                    for="editorAutoObfuscateCheck">
                    <span class="toggle-label" style="font-size:0.83rem; color:#aaa;">
                        <i class="ph ph-shield-check" style="color:#60a5fa"></i> Auto-Obfuscate
                        <span class="toggle-badge">API</span>
                    </span>
                    <span class="toggle-switch toggle-switch-sm">
                        <input type="checkbox" id="editorAutoObfuscateCheck" checked>
                        <span class="toggle-thumb"></span>
                    </span>
                </label>
                <button class="btn-primary btn-sm" id="saveBtn" style="display:none">
                    <i class="ph ph-floppy-disk"></i> Save
                </button>
            </div>
            <button class="icon-btn" id="logoutBtn" title="Sign out" style="display:none"><i
                    class="ph ph-sign-out"></i></button>
        </div>
    </nav>

    <!-- Editor Top Bar -->
    <div class="editor-topbar">
        <div class="editor-breadcrumb">
            <a href="index.html" style="color:#666"><i class="ph ph-house"></i></a>
            <span style="color:#444">/</span>
            <a id="repoLink" href="#" style="color:#aaa">repository</a>
            <span style="color:#444">/</span>
            <span id="fileNameDisplay" style="color:#fff;font-family:'JetBrains Mono',monospace">file.txt</span>
        </div>
        <div style="display:flex;gap:12px;font-size:0.82rem;color:#555">
            <span id="langLabel"></span>
            <span id="linesLabel"></span>
        </div>
    </div>

    <!-- Monaco Editor -->
    <div class="editor-wrap">
        <div id="monacoContainer"></div>
    </div>

    <!-- Monaco Loader -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script src="script.js"></script>
    <script type="module">
        import { requireAuth, logout, getCurrentUserProfile } from "./auth.js";
        import { supabase } from "./supabase-config.js";

        const params = new URLSearchParams(location.search);
        const repoId = params.get("repoId");
        const fileName = params.get("file");

        if (!repoId || !fileName) { window.location.href = "index.html"; }

        let monaco_editor = null;
        let originalContent = "";

        // ── Init ─────────────────────────────────────────────
        (async () => {
            try {
                // Get user if logged in, but don't require it
                const userProfile = await getCurrentUserProfile();

                // Get repo owner info
                const { data: repoData } = await supabase.from('repositories').select('*').eq('id', repoId).single();
                const isOwner = userProfile && repoData && repoData.owner_id === userProfile.uid;

                if (isOwner) {
                    document.getElementById("saveBtn").style.display = "inline-flex";
                    document.getElementById("saveStatus").style.display = "inline-block";
                    document.getElementById("logoutBtn").style.display = "inline-flex";
                }

                // Update UI
                document.getElementById("fileNameDisplay").textContent = fileName;
                document.getElementById("repoLink").href = `repo.html?id=${repoId}`;
                document.getElementById("repoLink").textContent = repoData ? repoData.name : repoId.substring(0, 8) + "...";
                document.title = `${fileName} — Singularity`;

                // Load file content (try .raw.lua first if owner, fallback to standard)
                let targetFileToDownload = fileName;
                if (isOwner && fileName.endsWith(".lua") && !fileName.endsWith(".raw.lua")) {
                    targetFileToDownload = fileName.replace(".lua", ".raw.lua");
                    document.getElementById("editorObfuscateWrapper").style.display = "flex";
                }

                let { data: fileData, error } = await supabase.storage.from('repos').download(`${repoId}/${targetFileToDownload}`);
                if (error) {
                    // Fallback to normal file if raw doesn't exist
                    const res = await supabase.storage.from('repos').download(`${repoId}/${fileName}`);
                    if (res.error) throw res.error;
                    fileData = res.data;
                }
                originalContent = await fileData.text();

                // Init Monaco
                require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs" } });
                require(["vs/editor/editor.main"], () => {
                    monaco_editor = monaco.editor.create(document.getElementById("monacoContainer"), {
                        value: originalContent,
                        language: detectLanguage(fileName),
                        theme: "vs-dark",
                        fontFamily: "'JetBrains Mono', monospace",
                        fontSize: 14,
                        lineNumbers: "on",
                        minimap: { enabled: true },
                        scrollBeyondLastLine: false,
                        wordWrap: "on",
                        automaticLayout: true,
                        readOnly: !isOwner
                    });

                    // Update info labels
                    document.getElementById("langLabel").textContent = detectLanguage(fileName).toUpperCase();
                    monaco_editor.onDidChangeModelContent(() => {
                        const lineCount = monaco_editor.getModel().getLineCount();
                        document.getElementById("linesLabel").textContent = `${lineCount} lines`;
                        setStatus("unsaved", "Unsaved changes");
                    });
                    document.getElementById("linesLabel").textContent = `${monaco_editor.getModel().getLineCount()} lines`;
                });

            } catch (_) { }
        })();

        // ── Save ─────────────────────────────────────────────
        async function obfuscateLuaCode(code) {
            const response = await fetch('https://singularity-raw.projectsingularity-v1.workers.dev/obfuscate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    source: code,
                    tier: "lite",
                    banner: false
                })
            });

            if (!response.ok) {
                const errText = await response.text().catch(() => response.status);
                throw new Error(`Obfuscator Error ${response.status}: ${errText}`);
            }

            const result = await response.json();
            console.log("[Obfuscator] Response:", result);

            const obfCode = result.source || result.output || result.code || result.result || result.script;
            if (!obfCode) throw new Error('ไม่พบโค้ดใน response: ' + JSON.stringify(Object.keys(result)));
            return obfCode;
        }

        // ── Obfuscator Save Logic ────────────────────────────
        const obfCheck = document.getElementById("editorAutoObfuscateCheck");
        if (obfCheck) {
            // Load saved preference
            const savedPref = localStorage.getItem("sg_autoObfuscate");
            if (savedPref !== null) {
                obfCheck.checked = savedPref === "true";
            }
            // Save preference on change
            obfCheck.addEventListener("change", (e) => {
                localStorage.setItem("sg_autoObfuscate", e.target.checked);
            });
        }

        document.getElementById("saveBtn").addEventListener("click", async () => {
            if (!monaco_editor) return;
            const content = monaco_editor.getValue();
            const autoObf = obfCheck?.checked;
            setStatus("saving", "Saving...");
            try {
                let contentType = "text/plain;charset=utf-8";
                if (fileName.endsWith(".lua") || fileName.endsWith(".txt") || fileName.endsWith(".js") || fileName.endsWith(".html") || fileName.endsWith(".css")) {
                    contentType = "text/plain;charset=utf-8";
                }

                if (fileName.endsWith(".lua") && autoObf) {
                    setStatus("saving", "Obfuscating...");
                    const obfuscatedCode = await obfuscateLuaCode(content);

                    // Save Raw
                    const rawBlob = new Blob([content], { type: contentType });
                    let rawName = fileName.replace(".lua", ".raw.lua");
                    await supabase.storage.from('repos').upload(`${repoId}/${rawName}`, rawBlob, { upsert: true, contentType });

                    // Save Obfuscated
                    const obfBlob = new Blob([obfuscatedCode], { type: contentType });
                    const { error } = await supabase.storage.from('repos').upload(`${repoId}/${fileName}`, obfBlob, { upsert: true, contentType });
                    if (error) throw error;
                } else {
                    const blob = new Blob([content], { type: contentType });
                    const { error } = await supabase.storage.from('repos').upload(`${repoId}/${fileName}`, blob, {
                        upsert: true,
                        contentType: contentType
                    });
                    if (error) throw error;
                }

                setStatus("saved", "Saved!");
                setTimeout(() => setStatus("", "No changes"), 2000);
            } catch (err) {
                setStatus("error", "Save failed!");
            }
        });

        // Ctrl+S shortcut
        document.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "s") {
                e.preventDefault();
                document.getElementById("saveBtn").click();
            }
        });

        // ── Logout ───────────────────────────────────────────
        document.getElementById("logoutBtn").addEventListener("click", () => logout());

        // ── Helpers ──────────────────────────────────────────
        function setStatus(cls, text) {
            const el = document.getElementById("saveStatus");
            el.className = "save-status" + (cls ? " " + cls : "");
            el.textContent = text;
        }

        function detectLanguage(name) {
            const ext = name.split(".").pop().toLowerCase();
            const map = {
                js: "javascript", ts: "typescript", html: "html", css: "css",
                json: "json", py: "python", lua: "lua", md: "markdown",
                txt: "plaintext", sh: "shell", yaml: "yaml", yml: "yaml",
                xml: "xml", sql: "sql", go: "go", rs: "rust", cpp: "cpp",
                c: "c", cs: "csharp", java: "java", php: "php"
            };
            return map[ext] || "plaintext";
        }
    </script>
</body>

</html>
