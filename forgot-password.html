<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Singularity</title>
    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/kentatvv1-tech/UI-BYKENTA/main/logo%20w.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <script src="i18n.js"></script>
</head>

<body>
    <canvas id="starfield"></canvas>

    <div class="auth-wrapper">
        <div class="auth-card glass-panel">
            <!-- Logo -->
            <div class="auth-logo">
                <img src="https://raw.githubusercontent.com/kentatvv1-tech/UI-BYKENTA/main/logo%20w.png"
                    alt="Singularity Logo" class="auth-logo-img">
                <span>Singularity</span>
            </div>
            <h2 class="auth-title">Reset your password</h2>
            <p style="text-align: center; color: #aaa; margin-bottom: 24px; font-size: 0.9rem;">Enter your email address
                and we will send you a link to reset your password.</p>

            <!-- Error/Success Banner -->
            <div id="statusBanner" class="error-banner hidden" style="margin-bottom: 24px;"></div>

            <!-- Form -->
            <form id="forgotPasswordForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>

                <button type="submit" id="submitBtn" class="btn-auth">
                    <span id="submitBtnText">Send Reset Link</span>
                    <span id="submitSpinner" class="spinner hidden"></span>
                </button>
            </form>

            <p class="auth-footer">
                Remember your password? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { resetPasswordForEmail } from "./auth.js";

        // Setup Starfield
        const canvas = document.getElementById("starfield");
        const ctx = canvas.getContext("2d");
        let width, height, stars = [];

        function initStars() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            stars = Array.from({ length: 150 }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 1.5,
                vx: (Math.random() - 0.5) * 0.2,
                vy: (Math.random() - 0.5) * 0.2
            }));
        }

        function drawStars() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            stars.forEach(s => {
                s.x = (s.x + s.vx + width) % width;
                s.y = (s.y + s.vy + height) % height;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener("resize", initStars);
        initStars();
        drawStars();

        // Handle form
        const form = document.getElementById("forgotPasswordForm");
        const statusBanner = document.getElementById("statusBanner");
        const submitBtn = document.getElementById("submitBtn");
        const btnText = document.getElementById("submitBtnText");
        const spinner = document.getElementById("submitSpinner");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();

            statusBanner.classList.add("hidden");
            submitBtn.disabled = true;
            btnText.textContent = "Sending...";
            spinner.classList.remove("hidden");

            try {
                await resetPasswordForEmail(email);
                statusBanner.textContent = "Check your email for the password reset link.";
                statusBanner.className = "error-banner success";
                statusBanner.style.backgroundColor = "rgba(46, 204, 113, 0.1)";
                statusBanner.style.color = "#2ecc71";
                statusBanner.style.borderColor = "rgba(46, 204, 113, 0.3)";
                statusBanner.classList.remove("hidden");
                form.reset();
            } catch (err) {
                console.error("Reset error:", err);
                statusBanner.textContent = err.message || "Failed to send reset link.";
                statusBanner.className = "error-banner hidden";
                statusBanner.style.backgroundColor = "";
                statusBanner.style.color = "";
                statusBanner.style.borderColor = "";
                statusBanner.classList.remove("hidden");
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = "Send Reset Link";
                spinner.classList.add("hidden");
            }
        });
    </script>
</body>

</html>
