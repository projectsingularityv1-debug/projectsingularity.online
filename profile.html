<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Singularity</title>
    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/kentatvv1-tech/UI-BYKENTA/main/logo%20w.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <canvas id="starfield"></canvas>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">
                <img src="https://raw.githubusercontent.com/kentatvv1-tech/UI-BYKENTA/main/logo%20w.png"
                    alt="Singularity Logo" class="custom-logo">
                <span>Singularity</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="issues.html">Issues</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="scripts.html">Scripts Hub</a></li>
            <li><a href="key.html" style="color:#ff8000;font-weight:600;">🔑 My Key</a></li>
            <li><a href="executors.html" class="active">Executors</a></li>
        </ul>
        <div class="nav-right">
            <button class="icon-btn" id="logoutBtn" title="Sign out"><i class="ph ph-sign-out"></i></button>
        </div>
    </nav>

    <!-- Main -->
    <main class="container" style="align-items:flex-start">
        <!-- Profile Card -->
        <aside style="width:280px;flex-shrink:0">
            <div class="glass-panel" style="padding:28px;text-align:center">
                <div style="position:relative;display:inline-block;margin-bottom:16px">
                    <img id="profileAvatar" src="https://ui-avatars.com/api/?name=U&background=000&color=fff&size=96"
                        alt="Profile"
                        style="width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,255,255,0.2)">
                    <label for="avatarUpload" title="Change avatar"
                        style="position:absolute;bottom:0;right:0;background:#fff;color:#000;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem">
                        <i class="ph ph-pencil-simple"></i>
                        <input type="file" id="avatarUpload" accept="image/*" style="display:none">
                    </label>
                </div>
                <h2 id="profileUsername" style="font-size:1.2rem;margin-bottom:4px">—</h2>
                <p id="profileEmail" style="color:#666;font-size:0.85rem;margin-bottom:20px">—</p>

                <div style="display:flex;justify-content:center;gap:24px;margin-bottom:20px">
                    <div style="text-align:center">
                        <div id="repoCount" style="font-size:1.4rem;font-weight:700">0</div>
                        <div style="font-size:0.75rem;color:#666">Repos</div>
                    </div>
                </div>

                <button class="btn-primary" id="editProfileBtn" style="width:100%">
                    <i class="ph ph-pencil-simple"></i> Edit Profile
                </button>
            </div>

            <!-- Edit Profile Form (hidden by default) -->
            <div id="editProfileForm" class="glass-panel hidden" style="padding:24px;margin-top:16px">
                <h3 style="margin-bottom:16px;font-size:0.95rem">Edit Profile</h3>
                <div id="editProfileError" class="error-banner hidden"></div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="editUsername">
                </div>
                <div style="display:flex;gap:10px;margin-top:16px">
                    <button class="btn-secondary" id="cancelEditBtn" style="flex:1">Cancel</button>
                    <button class="btn-primary" id="saveProfileBtn" style="flex:1">
                        <span id="saveProfileText">Save</span>
                        <span id="saveProfileSpinner" class="spinner hidden"></span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Repositories -->
        <section class="content-area">
            <div class="section-header" style="margin-bottom:20px">
                <h2 style="font-size:1.1rem">Repositories</h2>
                <a href="index.html" class="btn-primary btn-sm"><i class="ph ph-plus"></i> New</a>
            </div>
            <div id="profileRepoList">
                <div style="color:#555;text-align:center;padding:40px">Loading...</div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script type="module">
        import { requireAuth, logout, getCurrentUserProfile } from "./auth.js";
        import { supabase } from "./supabase-config.js";

        let currentUser = null;

        // ── Init ─────────────────────────────────────────────
        (async () => {
            try {
                await requireAuth();
                currentUser = await getCurrentUserProfile();
                if (!currentUser) return;

                // Fill profile
                document.getElementById("profileUsername").textContent = currentUser.username;
                document.getElementById("profileEmail").textContent = currentUser.email;
                if (currentUser.avatar_url) document.getElementById("profileAvatar").src = currentUser.avatar_url;
                document.getElementById("editUsername").value = currentUser.username;
                document.title = `${currentUser.username} — Singularity`;

                // Load repos
                const { data: repos, error } = await supabase.from('repositories').select('*').eq('owner_id', currentUser.uid);
                if (repos) {
                    document.getElementById("repoCount").textContent = repos.length;
                    renderProfileRepos(repos);
                }

            } catch (_) { }
        })();

        function renderProfileRepos(repos) {
            const container = document.getElementById("profileRepoList");
            if (repos.length === 0) {
                container.innerHTML = `<div style="color:#555;text-align:center;padding:40px">No repositories yet.</div>`;
                return;
            }
            container.innerHTML = "";
            repos.forEach(repo => {
                const card = document.createElement("div");
                card.className = "glass-panel";
                card.style.cssText = "padding:20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;";
                card.innerHTML = `
                    <div>
                        <a href="repo.html?id=${repo.id}" style="font-weight:600;font-size:1rem;color:#fff">
                            <i class="ph ph-book-bookmark" style="margin-right:6px"></i>${escapeHtml(repo.name)}
                        </a>
                        <p style="color:#666;font-size:0.85rem;margin-top:4px">${escapeHtml(repo.description || "No description")}</p>
                    </div>
                    <span class="badge ${repo.is_private ? 'private' : 'public'}">${repo.is_private ? 'Private' : 'Public'}</span>
                `;
                container.appendChild(card);
            });
        }

        // ── Avatar Upload ─────────────────────────────────────
        document.getElementById("avatarUpload").addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file || !currentUser) return;
            const { error: uploadError } = await supabase.storage.from('avatars').upload(`${currentUser.uid}`, file, { upsert: true });
            if (uploadError) {
                window.showToast("Failed to upload avatar: " + uploadError.message, "error");
                return;
            }
            const { data: { publicUrl } } = supabase.storage.from('avatars').getPublicUrl(`${currentUser.uid}`);

            // Update profile with unique URL (add timestamp to bypass cache)
            const finalUrl = publicUrl + "?t=" + Date.now();
            await supabase.from('profiles').update({ avatar_url: finalUrl }).eq('id', currentUser.uid);

            document.getElementById("profileAvatar").src = finalUrl;
            currentUser.avatar_url = finalUrl;
        });

        // ── Edit Profile ─────────────────────────────────────
        document.getElementById("editProfileBtn").addEventListener("click", () => {
            document.getElementById("editProfileForm").classList.toggle("hidden");
        });
        document.getElementById("cancelEditBtn").addEventListener("click", () => {
            document.getElementById("editProfileForm").classList.add("hidden");
        });

        document.getElementById("saveProfileBtn").addEventListener("click", async () => {
            const username = document.getElementById("editUsername").value.trim();
            const errEl = document.getElementById("editProfileError");
            const spinner = document.getElementById("saveProfileSpinner");
            const btnText = document.getElementById("saveProfileText");
            const btn = document.getElementById("saveProfileBtn");

            if (!username) {
                errEl.textContent = "Username cannot be empty.";
                errEl.classList.remove("hidden");
                return;
            }

            errEl.classList.add("hidden");
            btn.disabled = true;
            btnText.textContent = "Saving...";
            spinner.classList.remove("hidden");

            try {
                await supabase.from('profiles').update({ username }).eq('id', currentUser.uid);
                currentUser.username = username;
                document.getElementById("profileUsername").textContent = username;
                document.getElementById("editProfileForm").classList.add("hidden");
            } catch (err) {
                errEl.textContent = "Failed to save profile.";
                errEl.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btnText.textContent = "Save";
                spinner.classList.add("hidden");
            }
        });

        // ── Logout ───────────────────────────────────────────
        document.getElementById("logoutBtn").addEventListener("click", () => logout());

        function escapeHtml(str) {
            return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>

</html>
